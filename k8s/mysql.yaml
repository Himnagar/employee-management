apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: mysql-pvc
  namespace: employee

spec:

  accessModes:
    - ReadWriteOnce

  resources:

    requests:
      storage: 2Gi


---

apiVersion: apps/v1
kind: Deployment

metadata:
  name: mysql
  namespace: employee

spec:

  replicas: 1

  selector:

    matchLabels:
      app: mysql

  template:

    metadata:

      labels:
        app: mysql

    spec:

      containers:

        - name: mysql

          image: mysql:8.0

          ports:

            - containerPort: 3306

          env:

            - name: MYSQL_DATABASE

              valueFrom:

                configMapKeyRef:

                  name: employee-config

                  key: DB_NAME


            - name: MYSQL_USER

              valueFrom:

                secretKeyRef:

                  name: employee-secret

                  key: DB_USER


            - name: MYSQL_PASSWORD

              valueFrom:

                secretKeyRef:

                  name: employee-secret

                  key: DB_PASSWORD


            - name: MYSQL_ROOT_PASSWORD

              valueFrom:

                secretKeyRef:

                  name: employee-secret

                  key: MYSQL_ROOT_PASSWORD


          volumeMounts:

            - name: mysql-data

              mountPath: /var/lib/mysql


      volumes:

        - name: mysql-data

          persistentVolumeClaim:

            claimName: mysql-pvc


---

apiVersion: v1
kind: Service

metadata:
  name: mysql-service
  namespace: employee

spec:

  type: ClusterIP

  selector:

    app: mysql

  ports:

    - port: 3306

      targetPort: 3306
